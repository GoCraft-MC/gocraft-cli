# Publishes a downloadable binary for every tagged version.
#
# Pushing the tag is the whole release step. There is no separate "publish"
# button to forget: the tag is what a consumer pins, so the tag is what produces
# the artefact it pins to.
#
# The Gradle plugin downloads these by URL rather than resolving them from a
# Maven repository, because a native binary is not a dependency — it is a
# program, and dressing it as a jar would buy nothing but a classifier nobody
# reads. The naming scheme below is therefore a contract: it is constructed by
# whoever downloads, so it may not change without changing them too.
#
#   gocraft-cli_<tag>_<os>_<arch>[.exe]
#   checksums.txt
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag that fails its own tests must not become a download. Nothing here
  # rebuilds what CI already ran on the branch: a tag can point anywhere, so it
  # is checked as the thing being released rather than trusted for its history.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, extension: .exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # No cgo: the result is one static file that runs on a machine with
          # nothing installed, which is what a build tool downloaded mid-build
          # has to be.
          CGO_ENABLED: "0"
        run: |
          name="gocraft-cli_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}${{ matrix.extension }}"
          # -trimpath keeps the runner's directory layout out of the binary, so
          # the same tag built twice gives the same bytes. -X stamps the version
          # the tool reports, which is otherwise "dev".
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" .
          echo "name=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: dist/${{ env.name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One file, so a downloader verifies what it got without a second
      # request per platform.
      - name: Checksums
        run: |
          cd dist
          sha256sum gocraft-cli_* > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
